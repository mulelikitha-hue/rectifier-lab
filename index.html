<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RectifierLab</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#14213d;--mut:#5b6b85;--line:#d5dbe6;--acc:#0284c7;--g:#059669;--o:#d97706;--r:#dc2626;--v:#7c3aed;--wire:#3b4a63;--dev:#e8eef7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111b2e;--ink:#e6edf7;--mut:#8fa1bd;--line:#23324d;--acc:#38bdf8;--g:#34d399;--o:#fbbf24;--r:#f87171;--v:#a78bfa;--wire:#6f86a8;--dev:#162338}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111b2e;--ink:#e6edf7;--mut:#8fa1bd;--line:#23324d;--acc:#38bdf8;--g:#34d399;--o:#fbbf24;--r:#f87171;--v:#a78bfa;--wire:#6f86a8;--dev:#162338}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:grid;grid-template-columns:280px 1fr;gap:14px;padding:14px;max-width:1400px;margin:auto}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
h1{font-size:19px;margin:0}h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.mut{color:var(--mut);font-size:12px}
.seg{display:flex;gap:4px}.seg button,.b,select{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.seg button.on,.b.on{background:var(--acc);border-color:var(--acc);color:#fff}
label{display:block;font-size:12px;color:var(--mut);margin-top:8px}label b{float:right;color:var(--ink);font-family:ui-monospace,monospace}
input[type=range]{width:100%;accent-color:var(--acc)}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
svg{width:100%;height:auto;display:block;max-height:340px}
.w{fill:none;stroke:var(--wire);stroke-width:2}.dot{fill:var(--wire)}.t{fill:var(--mut);font:11px system-ui}
.ldb{fill:var(--card);stroke:var(--wire);stroke-width:2}
.dv{cursor:pointer}.dv .bx{fill:var(--card);stroke:transparent}.dv .tri{fill:var(--dev);stroke:var(--wire);stroke-width:2}.dv .bar{stroke:var(--wire);stroke-width:2;fill:none}
.dv.on .bx{fill:color-mix(in srgb,var(--g) 20%,var(--card));stroke:var(--g)}.dv.on .tri{fill:var(--g);stroke:var(--g)}.dv.on .bar{stroke:var(--g)}.dv.dim{opacity:.35}
#cv{width:100%;height:390px;display:block}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.ctl input[type=range]{flex:1;min-width:140px}.ctl .b,.ctl select{flex:none;padding:6px 12px}
.m{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.m>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}.m span{font-size:11px;color:var(--mut)}.m b{display:block;font:600 22px ui-monospace,monospace}.m i{font-style:normal;font-size:11px;color:var(--mut)}
.lg span{margin-right:10px;font-size:12px}
</style></head><body><div class="app">
<aside class="card" id="side"><h1>⚡ RectifierLab</h1><div class="mut">Interactive rectifier simulator</div>
<h3>Supply</h3><div class="seg" data-k="ph"><button data-v="1">Single-phase</button><button data-v="3">Three-phase</button></div>
<h3>Topology</h3><div class="seg" data-k="top"><button data-v="hw">Half-wave</button><button data-v="fb">Full-bridge</button></div>
<h3>Devices</h3><div class="seg" id="pre"><button data-p="D">Diodes</button><button data-p="T">Thyristors</button><button data-p="S" id="semi">Semi</button></div>
<div class="mut" style="margin-top:4px">Click a device in the schematic to toggle diode ↔ thyristor.</div>
<h3>Firing</h3><div id="sl1"></div><label><input type="checkbox" id="fw"> Freewheeling diode</label>
<h3>Load</h3><div class="seg" data-k="load"><button data-v="R">R</button><button data-v="RL">RL</button><button data-v="RLE">RLE</button></div><div id="sl2"></div>
<h3>Display</h3><button class="b" id="theme" style="width:100%">Toggle light / dark</button></aside>
<main class="main">
<section class="card"><div class="hd"><b id="ttl"></b><span class="mut" id="rd"></span></div><div id="sch"></div></section>
<section class="card"><div class="hd"><div class="seg" data-k="tab" style="min-width:230px"><button data-v="w">Waveforms</button><button data-v="h">Harmonics (FFT)</button></div>
<div class="lg"><span style="color:var(--acc)">┄ source</span><span style="color:var(--g)">━ v<sub>o</sub></span><span style="color:var(--o)">━ i<sub>o</sub></span><span style="color:var(--v)">━ i<sub>s</sub></span></div></div>
<canvas id="cv"></canvas>
<div class="ctl"><button class="b" id="run">▶ Run</button><span class="mut">ωt</span><input type="range" id="wt" min="0" max="359.5" step="0.5" value="0"><select id="spd"><option value=".1">0.1×</option><option value=".25">0.25×</option><option value=".5" selected>0.5×</option><option value="1">1×</option><option value="2">2×</option></select></div></section>
<section class="m" id="mt"></section>
<section class="card" id="th"></section>
</main></div>
<script>
const $=s=>document.querySelector(s),P=Math.PI;
const S={ph:1,top:'fb',dev:{},fw:false,load:'RL',R:20,L:45,E:50,V:230,a:45,wt:0,spd:.5,tab:'w',run:0};
const ids=()=>S.ph==1?(S.top=='hw'?['T1']:['T1','T2','T3','T4']):(S.top=='hw'?['T1','T2','T3']:['T1','T2','T3','T4','T5','T6']);
const th=id=>S.dev[id]=='T';
const preset=k=>ids().forEach(id=>S.dev[id]=(k=='T'||(k=='S'&&(id=='T1'||id=='T3')))?'T':'D');
let Rs;
function sim(){
 const N=720,dt=.02/N,Vm=S.V*Math.SQRT2,R=S.R,Lh=S.load=='R'?0:S.L/1e3,E=S.load=='RLE'?S.E:0,one=S.ph==1,hw=S.top=='hw',al=Math.round(S.a);
 const any=ids().some(th)?al:0;
 const sa=one?(hw?[th('T1')?al:0]:[(th('T1')||th('T2'))?al:0,(th('T3')||th('T4'))?al:0]):Array(hw?3:6).fill(any);
 const st=(one?(hw?[sa[0]]:[sa[0],180+sa[1]]):sa.map((a,j)=>30+(hw?120:60)*j+a)).map(d=>d%360);
 const fs=new Set(st.map(d=>d*2)),mx=Math.max(...st),sc=[];
 for(let k=0;k<N;k++){let b=-1,id=st.indexOf(mx);st.forEach((d,j)=>{if(d*2<=k&&d>b){b=d;id=j}});sc.push(id)}
 const pr=[[0,1],[0,2],[1,2],[1,0],[2,0],[2,1]],pl=[['T1','T6'],['T1','T2'],['T3','T2'],['T3','T4'],['T5','T4'],['T5','T6']];
 const ph=(k,w)=>Vm*Math.sin(w-k*2*P/3);
 const clamp=S.fw||(one&&!hw&&((th('T1')&&th('T3')&&!th('T2')&&!th('T4'))||(th('T2')&&th('T4')&&!th('T1')&&!th('T3'))));
 const o={vo:[],io:[],is:[],act:[],v:[[],[],[]]};let i=0,on=0,fired=0;
 for(let n=0;n<8*N;n++){
  const k=n%N,w=k*2*P/N,s=sc[k];if(fs.has(k))fired=1;
  const v0=one?(hw||!s?ph(0,w):-ph(0,w)):(hw?ph(s,w):ph(pr[s][0],w)-ph(pr[s][1],w));
  if(!on&&(fired||sa[s]==0)&&v0>E+1e-6)on=1;
  let v=E,fr=0,c=0,a='';
  if(on){v=v0;if(clamp&&v<0){v=0;fr=1}
   const ii=(v-E)/R;i=Lh?ii+(i-ii)*Math.exp(-R*dt/Lh):ii;
   if(i<=1e-6){i=0;on=0;fired=sa[s]==0}
   else if(fr)a=S.fw?'DF':'FW';
   else{a=one?(hw?'T1':s?'T3,T4':'T1,T2'):(hw?'T'+(s+1):pl[s].join(','));
    c=one?(hw||!s?i:-i):(hw?(s==0?i:0):(pr[s][0]==0?i:0)-(pr[s][1]==0?i:0))}}
  if(n>=7*N){o.vo.push(v);o.io.push(i);o.is.push(c);o.act.push(a);[0,1,2].forEach(q=>o.v[q].push(ph(q,w)))}
 }
 const m=a=>a.reduce((x,y)=>x+y,0)/N,rm=a=>Math.sqrt(m(a.map(x=>x*x)));
 const Vdc=m(o.vo),Vr=rm(o.vo),Idc=m(o.io),Ir=rm(o.io),Is=rm(o.is),Pw=R*Ir*Ir+E*Idc,Sv=(one?1:3)*S.V*Is;
 const hm=[];for(let h=1;h<=25;h++){let a=0,b=0;o.is.forEach((x,k)=>{a+=x*Math.cos(h*2*P*k/N);b+=x*Math.sin(h*2*P*k/N)});hm.push(2/N*Math.hypot(a,b))}
 const I1=hm[0]/Math.SQRT2,isT=ids().some(th),c=isT?Math.cos(S.a*P/180):1,Vp=Vm/P,s3=3*Math.sqrt(3)*Vm/P;
 let tv,tf;
 if(one&&hw){tv=Vp/2*(1+c);tf='Vm/2π · (1 + cos α)'}
 else if(one){if(!isT){tv=2*Vp;tf='2Vm/π'}else if(clamp){tv=Vp*(1+c);tf='Vm/π · (1 + cos α)'}else{tv=2*Vp*c;tf='2Vm/π · cos α'}}
 else if(hw){tv=s3/2*c;tf='3√3·Vm/2π · cos α'}else{tv=s3*c;tf='3√3·Vm/π · cos α'}
 return{o,Vdc,Vr,Idc,Ir,Pw,Sv,PF:Sv>1e-6?Pw/Sv:0,RF:Vdc>1e-6?Math.sqrt(Math.max(0,(Vr/Vdc)**2-1)):0,FF:Vdc>1e-6?Vr/Vdc:0,hm,thd:I1>1e-6?Math.sqrt(Math.max(0,Is*Is-I1*I1))/I1*100:0,mode:Math.min(...o.io)<1e-6?'DCM':'CCM',tv,tf,Vm}
}
/* ---------- schematic ---------- */
const W=(...p)=>`<polyline class="w" points="${p.join(' ')}"/>`,
T=(x,y,s)=>`<text x="${x}" y="${y}" class="t" text-anchor="middle">${s}</text>`,
src=(x,y,l,r=17)=>`<circle cx="${x}" cy="${y}" r="${r}" class="w"/>${T(x,y+4,l)}`,
dot=(x,y)=>`<circle class="dot" cx="${x}" cy="${y}" r="3"/>`,
D=(id,x,y,r,lx,ly)=>`<g class="dv${id=='DF'&&!S.fw?' dim':''}" data-id="${id}"><g transform="translate(${x} ${y}) rotate(${r})"><rect x="-24" y="-17" width="48" height="34" rx="6" class="bx"/><path d="M-9-10L9 0L-9 10Z" class="tri"/><path d="M9-11V11" class="bar"/>${id!='DF'&&th(id)?'<path d="M-1 5L-8 16" class="bar"/>':''}</g>${T(lx,ly,id)}</g>`,
LD=(t,b)=>{const m=(t+b)/2,x=(y,s)=>T(490,y,s);return W('430,'+t,'430,'+b)+W('490,'+t,'490,'+b)+dot(430,t)+dot(430,b)+D('DF',430,m,-90,404,m+4)+`<rect x="462" y="${m-34}" width="56" height="68" rx="6" class="ldb"/>`+x(m-12,'R '+S.R+'Ω')+(S.load!='R'?x(m+4,'L '+S.L+'mH'):'')+(S.load=='RLE'?x(m+20,'E '+S.E+'V'):'')};
function schem(){
 let o;
 if(S.ph==1)o=S.top=='hw'?src(60,150,'~')+W('60,133','60,70','490,70')+W('60,167','60,250','490,250')+D('T1',190,70,0,190,46)+LD(70,250)
  :src(60,160,'~')+W('77,160','170,160')+W('170,160','260,70','350,160','260,250','170,160')+W('60,177','60,285','350,285','350,160')+W('260,70','490,70')+W('260,250','490,250')+D('T1',215,115,-45,184,104)+D('T3',305,115,-135,336,104)+D('T4',215,205,-135,184,226)+D('T2',305,205,-45,336,226)+LD(70,250);
 else if(S.top=='hw')o=[100,150,200].map((y,j)=>src(60,y,'abc'[j])+W('77,'+y,'300,'+y)+W('43,'+y,'20,'+y)+D('T'+(j+1),190,y,0,190,y-22)).join('')+W('300,60','300,200')+W('300,60','490,60')+W('20,100','20,270','490,270')+LD(60,270);
 else o=[126,160,194].map((y,j)=>src(60,y,'abc'[j],13)+W('73,'+y,(190+70*j)+','+y)+dot(190+70*j,y)).join('')+[190,260,330].map(x=>W(x+',50',x+',270')).join('')+W('190,50','490,50')+W('190,270','490,270')+D('T1',190,90,-90,222,94)+D('T3',260,110,-90,292,114)+D('T5',330,120,-90,362,124)+D('T4',190,235,-90,222,239)+D('T6',260,235,-90,292,239)+D('T2',330,235,-90,362,239)+LD(50,270);
 return `<svg viewBox="0 0 540 ${S.ph==1?300:290}">${o}</svg>`
}
function hl(){const k=Math.round(S.wt*2)%720,set=new Set(Rs.o.act[k].split(','));document.querySelectorAll('.dv').forEach(e=>e.classList.toggle('on',set.has(e.dataset.id)));
 $('#rd').textContent=`ωt ${S.wt.toFixed(1)}°  ·  vo ${Rs.o.vo[k].toFixed(0)} V  ·  io ${Rs.o.io[k].toFixed(2)} A  ·  ${Rs.o.act[k]||'all off'}`}
/* ---------- plots ---------- */
function draw(){
 const c=$('#cv'),Wd=c.clientWidth,H=c.clientHeight,d=devicePixelRatio||1;c.width=Wd*d;c.height=H*d;
 const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
 const css=getComputedStyle(document.documentElement),C=n=>css.getPropertyValue(n).trim(),ml=46,pw=Wd-ml-12,N=720,X=k=>ml+k/N*pw,r=Rs,o=r.o;
 x.font='11px system-ui';x.fillStyle=C('--mut');x.strokeStyle=C('--line');x.lineWidth=1;
 if(S.tab=='h'){const h0=22,bh=H-60,bw=pw/25;x.strokeRect(ml,h0,pw,bh);
  r.hm.forEach((a,j)=>{const p=a/r.hm[0]*100||0,hh=p/100*bh;x.fillStyle=C('--v');x.fillRect(ml+j*bw+3,h0+bh-hh,bw-6,hh);x.fillStyle=C('--mut');if(j%2==0)x.fillText(j+1,ml+j*bw+bw/2-4,h0+bh+14)});
  x.fillText('Source-current harmonics, % of fundamental   ·   THD = '+r.thd.toFixed(1)+' %',ml,14);x.fillText('100%',6,h0+10);x.fillText('0',30,h0+bh);return}
 const ph=(H-92)/2,y1=6,y2=y1+ph+16,y3=y2+ph+16;
 const pn=(y0,ser,u)=>{const mx=Math.ceil(Math.max(1,...ser.flatMap(s=>s[0].map(Math.abs)))*1.12),Y=v=>y0+ph/2-v/mx*ph/2;
  x.strokeStyle=C('--line');x.setLineDash([]);x.lineWidth=1;x.strokeRect(ml,y0,pw,ph);
  for(let g=1;g<4;g++){x.beginPath();x.moveTo(ml+pw*g/4,y0);x.lineTo(ml+pw*g/4,y0+ph);x.stroke()}
  x.beginPath();x.moveTo(ml,Y(0));x.lineTo(ml+pw,Y(0));x.stroke();
  x.fillStyle=C('--mut');x.fillText(mx+u,4,y0+10);x.fillText('-'+mx+u,4,y0+ph);x.fillText('0',34,Y(0)+4);
  ser.forEach(([a,col,w,ds])=>{x.beginPath();x.setLineDash(ds?[5,4]:[]);x.strokeStyle=C(col);x.lineWidth=w;a.forEach((v,k)=>k?x.lineTo(X(k),Y(v)):x.moveTo(X(k),Y(v)));x.stroke()});x.setLineDash([])};
 pn(y1,[...(S.ph==1?[[o.v[0],'--acc',1.5,1]]:[[o.v[0],'--acc',1,1],[o.v[1],'--acc',1,1],[o.v[2],'--acc',1,1]]),[o.vo,'--g',2.2]],'V');
 pn(y2,[[o.is,'--v',1.5,1],[o.io,'--o',2.2]],'A');
 x.strokeStyle=C('--line');x.strokeRect(ml,y3,pw,24);
 let s0=0;for(let k=1;k<=N;k++)if(k==N||o.act[k]!=o.act[s0]){const a=o.act[s0];if(a){x.fillStyle=a=='FW'||a=='DF'?C('--o'):C('--g');x.globalAlpha=.3;x.fillRect(X(s0),y3,X(k)-X(s0),24);x.globalAlpha=1;x.fillStyle=C('--ink');if(X(k)-X(s0)>34)x.fillText(a,(X(s0)+X(k))/2-a.length*2.6,y3+16)}s0=k}
 x.fillStyle=C('--mut');[0,90,180,270,360].forEach(a=>x.fillText(a+'°',ml+pw*a/360-(a?8:0),y3+40));
 const kx=X(S.wt*2);x.strokeStyle=C('--r');x.lineWidth=1.5;x.beginPath();x.moveTo(kx,y1);x.lineTo(kx,y3+24);x.stroke();
}
/* ---------- metrics / ui ---------- */
function metrics(){const r=Rs,f=(a,b,u,s)=>`<div><span>${a}</span><b>${b}<small> ${u}</small></b><i>${s}</i></div>`;
 $('#mt').innerHTML=f('Avg DC voltage',r.Vdc.toFixed(1),'V','Vrms '+r.Vr.toFixed(1)+' V')+f('Avg DC current',r.Idc.toFixed(2),'A','Irms '+r.Ir.toFixed(2)+' A')+f('Load power',r.Pw.toFixed(0),'W','S = '+r.Sv.toFixed(0)+' VA')+f('Power factor',r.PF.toFixed(3),'',r.mode+' mode')+f('Ripple factor',r.RF.toFixed(3),'','FF '+r.FF.toFixed(2))+f('Source THD<sub>i</sub>',r.thd.toFixed(1),'%','input current');
 $('#th').innerHTML=`<span class="mut">THEORY (continuous conduction, ideal)</span><div style="font:600 15px ui-monospace,monospace;margin-top:4px">V<sub>dc</sub> = ${r.tf} = <span style="color:var(--g)">${r.tv.toFixed(1)} V</span> <span class="mut">(simulated ${r.Vdc.toFixed(1)} V, V<sub>m</sub> = ${r.Vm.toFixed(0)} V)</span></div>`;
 $('#ttl').textContent=(S.ph==1?'1-phase ':'3-phase ')+(S.top=='hw'?'half-wave':'full-bridge')+' · '+(ids().every(th)?'thyristor':ids().some(th)?'semi/mixed':'diode')+' · '+S.load+' load'}
const sl=(k,n,a,b,s,u)=>`<label id="r_${k}" data-u="${u}">${n} <b></b><input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}"></label>`;
$('#sl1').innerHTML=sl('a','Firing angle α',0,175,1,'°');$('#sl2').innerHTML=sl('R','R',1,100,1,' Ω')+sl('L','L',1,200,1,' mH')+sl('E','E (back-emf)',0,200,1,' V')+sl('V','Source RMS (phase)',100,400,5,' V');
function sync(){document.querySelectorAll('.seg[data-k] button').forEach(b=>b.classList.toggle('on',String(S[b.parentNode.dataset.k])==b.dataset.v));
 document.querySelectorAll('input[type=range][data-k]').forEach(i=>{i.value=S[i.dataset.k];i.previousElementSibling.textContent=i.value+i.parentNode.dataset.u});
 $('#r_L').style.display=S.load=='R'?'none':'';$('#r_E').style.display=S.load=='RLE'?'':'none';$('#r_a').style.opacity=ids().some(th)?1:.4;
 $('#semi').style.display=S.ph==1&&S.top=='fb'?'':'none';$('#fw').checked=S.fw}
function upd(){Rs=sim();sync();$('#sch').innerHTML=schem();metrics();hl();draw()}
function cur(){hl();draw()}
document.querySelectorAll('.seg[data-k] button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k;S[k]=k=='ph'?+b.dataset.v:b.dataset.v;if(k=='ph'||k=='top')preset(S.ph==1&&S.top=='fb'?'S':'T');upd()});
document.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>{preset(b.dataset.p);upd()});
document.querySelectorAll('input[type=range][data-k]').forEach(i=>i.oninput=()=>{S[i.dataset.k]=+i.value;upd()});
$('#fw').onchange=e=>{S.fw=e.target.checked;upd()};
$('#sch').onclick=e=>{const g=e.target.closest('.dv');if(!g)return;const id=g.dataset.id;if(id=='DF')S.fw=!S.fw;else{const t=th(id)?'D':'T';(S.ph==3?ids():[id]).forEach(j=>S.dev[j]=t)}upd()};
$('#wt').oninput=e=>{S.wt=+e.target.value;cur()};$('#spd').onchange=e=>S.spd=+e.target.value;
let last=0;function tick(t){if(!S.run)return;const d=t-last;last=t;S.wt=(S.wt+d/1000*90*S.spd)%360;$('#wt').value=S.wt;cur();requestAnimationFrame(tick)}
$('#run').onclick=()=>{S.run=!S.run;$('#run').textContent=S.run?'⏸ Pause':'▶ Run';if(S.run){last=performance.now();requestAnimationFrame(tick)}};
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d=='dark'?'light':'dark';draw()};
addEventListener('resize',draw);preset('S');upd();
</script></body></html>
